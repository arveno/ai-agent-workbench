name: Data Contract Check

on:
  pull_request:
    branches:
      - main
      - 'stage/**'

permissions:
  contents: read

jobs:
  data-contract-check:
    name: Data Contract Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base ref
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run data contract self-test
        run: node scripts/check-data-contract-self-test.mjs

      - name: Generate field registry doc
        run: node scripts/generate-field-registry-doc.mjs

      - name: Generate contract types
        run: node scripts/generate-contract-types.mjs

      - name: Check data contract
        run: node scripts/check-data-contract.mjs

      - name: Verify generated contracts are committed
        run: git diff --exit-code contracts/generated/field-registry.md contracts/generated/workbench-contract.ts
