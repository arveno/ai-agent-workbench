name: PR Template Check

on:
  pull_request:
    branches:
      - main
      - 'stage/**'
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-template-check:
    name: PR Template Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY_JSON: ${{ toJson(github.event.pull_request.body) }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const https = require('node:https');

          const requiredSections = [
            '# 关联 Issue',
            '# Issue Decision Snapshot',
            '# 本次目标',
            '# 修改范围',
            '# 明确不做',
            '# 主要改动',
            '# 架构自检清单',
            '# Data Contract 自检',
            '# Review Comment 归因',
            '# 验证结果',
            '# 风险点',
            '# 后续建议',
          ];

          const body = JSON.parse(process.env.PR_BODY_JSON || '""') || '';
          const errors = [];
          const warnings = [];
          const bodyLines = body
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean);
          const issueNumbers = [
            ...new Set(
              [...body.matchAll(/\b(?:Closes|Fixes|Resolves)\s+#(\d+)\b/gi)]
                .map((match) => Number(match[1]))
                .filter(Number.isInteger),
            ),
          ];

          for (const section of requiredSections) {
            if (!bodyLines.includes(section)) {
              errors.push(`Missing required PR template section: ${section}`);
            }
          }

          if (issueNumbers.length === 0) {
            errors.push('PR body must link an issue with Closes #123, Fixes #123, or Resolves #123.');
          }

          if (/\|\s*-\s*\|\s*-\s*\|\s*-\s*\|/.test(body)) {
            errors.push('PR body contains the default Review Comment attribution placeholder: | - | - | - |');
          }

          if (/- \[ \]/.test(body)) {
            errors.push('PR body contains unfinished checkbox: - [ ]');
          }

          if (!/- \[[xX]\]/.test(body)) {
            errors.push('PR body must contain at least one completed checkbox: - [x] or - [X]');
          }

          async function readIssue(issueNumber) {
            const token = process.env.GITHUB_TOKEN;
            const repository = process.env.REPOSITORY;

            if (!token) {
              throw new Error('GITHUB_TOKEN is unavailable.');
            }

            if (!repository) {
              throw new Error('GitHub repository is unavailable.');
            }

            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'api.github.com',
                path: `/repos/${repository}/issues/${issueNumber}`,
                method: 'GET',
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${token}`,
                  'User-Agent': 'ai-agent-workbench-pr-template-check',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              };

              const request = https.request(options, (response) => {
                let data = '';

                response.setEncoding('utf8');
                response.on('data', (chunk) => {
                  data += chunk;
                });
                response.on('end', () => {
                  if (response.statusCode < 200 || response.statusCode >= 300) {
                    reject(new Error(`GitHub API returned HTTP ${response.statusCode} for issue #${issueNumber}.`));
                    return;
                  }

                  try {
                    resolve(JSON.parse(data));
                  } catch (error) {
                    reject(new Error(`GitHub API returned invalid JSON for issue #${issueNumber}: ${error.message}`));
                  }
                });
              });

              request.on('error', reject);
              request.end();
            });
          }

          function labelNames(issue) {
            return (issue.labels || [])
              .map((label) => (typeof label === 'string' ? label : label.name))
              .filter(Boolean);
          }

          async function validateIssueLabels() {
            for (const issueNumber of issueNumbers) {
              try {
                const issue = await readIssue(issueNumber);
                const labels = labelNames(issue);

                if (issue.pull_request) {
                  errors.push(`Linked reference #${issueNumber} is a pull request. Link a GitHub Issue instead.`);
                }

                if (!labels.some((label) => /^type:[^\s]+$/.test(label))) {
                  errors.push(`Linked issue #${issueNumber} must have at least one type:* label.`);
                }

                if (!labels.some((label) => /^(area|scope):[^\s]+$/.test(label))) {
                  warnings.push(`Linked issue #${issueNumber} does not have an area:* or scope:* label.`);
                }
              } catch (error) {
                errors.push(`Unable to read linked issue #${issueNumber}: ${error.message}`);
              }
            }
          }

          async function main() {
            await validateIssueLabels();

            for (const warning of warnings) {
              console.warn(`Warning: ${warning}`);
            }

            if (errors.length > 0) {
              console.error('PR Template Check failed:');
              for (const error of errors) {
                console.error(`- ${error}`);
              }
              process.exit(1);
            }

            console.log('PR Template Check passed.');
          }

          main().catch((error) => {
            console.error('PR Template Check failed:');
            console.error(`- ${error.message}`);
            process.exit(1);
          });
          NODE
