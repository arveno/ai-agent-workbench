name: Review Gate

on:
  pull_request:
    branches:
      - main
      - 'stage/**'
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  review-gate:
    name: Review Gate
    runs-on: ubuntu-latest
    steps:
      - name: Require current review approval label
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const APPROVAL_LABEL = 'review:approved';
          const API_VERSION = '2022-11-28';

          const eventPath = process.env.GITHUB_EVENT_PATH;
          const event = JSON.parse(fs.readFileSync(eventPath, 'utf8'));
          const token = process.env.GITHUB_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const pullRequest = event.pull_request || {};
          const action = String(event.action || '');
          const labels = Array.isArray(event.pull_request?.labels)
            ? event.pull_request.labels.map((label) => String(label.name || ''))
            : [];
          const hasApprovalLabel = labels.includes(APPROVAL_LABEL);

          if (!token || !repository || !pullRequest.number) {
            console.error('Review Gate failed: missing GitHub event context.');
            process.exit(1);
          }

          async function request(path, options = {}) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': API_VERSION,
                ...(options.headers || {}),
              },
            });

            const text = await response.text().catch(() => '');

            return {
              ok: response.ok,
              status: response.status,
              statusText: response.statusText,
              text,
            };
          }

          async function removeApprovalLabel() {
            const encodedLabel = encodeURIComponent(APPROVAL_LABEL);
            return request(`/repos/${repository}/issues/${pullRequest.number}/labels/${encodedLabel}`, {
              method: 'DELETE',
            });
          }

          async function main() {
            if (action === 'synchronize' && hasApprovalLabel) {
              const removeResult = await removeApprovalLabel();

              if (removeResult.ok) {
                console.error('Review Gate failed: new commit pushed, existing review approval label was removed.');
                console.error('User must complete review again, then manually add the `review:approved` label.');
                process.exit(1);
              }

              if (removeResult.status === 403) {
                console.error('Review Gate failed: new commit pushed, but the current token cannot automatically remove `review:approved`.');
                console.error('User must manually remove the `review:approved` label.');
                console.error('After completing review again, manually add the `review:approved` label.');
                process.exit(1);
              }

              if (removeResult.status === 404) {
                console.error('Review Gate failed: new commit pushed, and `review:approved` is already absent or was already removed.');
                console.error('User must complete review again, then manually add the `review:approved` label.');
                process.exit(1);
              }

              console.error(`Review Gate failed: unexpected GitHub API error while removing review label: ${removeResult.status} ${removeResult.statusText}`);
              if (removeResult.text) {
                console.error(removeResult.text);
              }
              process.exit(1);
            }

            if (!hasApprovalLabel) {
              console.error('Review Gate failed: this PR needs a completed user review.');
              console.error('After completing substantive review, manually add the `review:approved` label.');
              console.error('Do not use PR body text as a substitute for this label.');
              process.exit(1);
            }

            console.log('Review Gate passed: review:approved label is present.');
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          });
          NODE
