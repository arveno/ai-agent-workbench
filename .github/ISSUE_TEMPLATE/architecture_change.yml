name: Architecture Change
description: 架构变更任务，用于先明确事实源、目标架构、迁移策略和退出条件。
title: "[Architecture] "
labels:
  - "type:architecture"
body:
  - type: markdown
    attributes:
      value: |
        Architecture Change 准入表单。执行硬规则见 `AGENTS.md`，长期事实源列在下方。
        本模板自动添加 `type:architecture` 标签；Project Type 由人工在 Project 中维护，并应与该标签语义一致。
  - type: textarea
    id: related_docs
    attributes:
      label: 关联文档
      description: 列出必须读取或需要变更的事实源文档。
      placeholder: |
        - docs/workflow.md
        - docs/architecture.md
        - docs/agent-run-lifecycle.md
        - docs/id-contract.md
        - docs/tool-governance.md
        - docs/source-lineage.md
        - docs/cloudbase-functions-deploy.md
    validations:
      required: true
  - type: textarea
    id: current_problem
    attributes:
      label: 当前问题
      description: 描述当前架构问题、重复链路、职责错位或事实源缺口。
    validations:
      required: true
  - type: textarea
    id: target_architecture
    attributes:
      label: 目标架构
      description: 描述目标主链路、职责边界、数据流和对象关系。
      placeholder: |
        目标链路：
        Raw -> Canonical -> ViewModel -> UI
    validations:
      required: true
  - type: textarea
    id: impact_scope
    attributes:
      label: 影响范围
      description: 列出涉及的生命周期节点、核心对象、前端模块、后端函数、数据库、Source、Tool 或部署边界。
    validations:
      required: true
  - type: textarea
    id: migration_strategy
    attributes:
      label: 迁移策略
      description: 描述如何删除旧链路、合并重复逻辑、收敛职责边界，以及每一步的验收方式。
    validations:
      required: true
  - type: textarea
    id: canonical_decision
    attributes:
      label: Canonical Decision
      description: 明确架构变更中的 canonical 对象、字段、数据层级和旧数据处理策略。
      placeholder: |
        - 哪些字段 / 对象是 canonical：
        - 是否允许修改现有字段：
        - 是否允许删除旧数据：
        - 是否允许重建 seed：
        - 不允许保留的 oldField/newField / legacy fallback：
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 明确不做
      description: 明确本次架构变更不处理的范围，避免阶段混杂。
    validations:
      required: true
  - type: textarea
    id: pr_exit_conditions
    attributes:
      label: PR 退出条件
      description: 判断何时停止当前 PR，关闭重开，或改由后置 Issue 承载。
      placeholder: |
        - 如果当前 PR 方向错误，是否应关闭重开：
        - 哪些情况不允许继续在旧 PR 上堆 commit：
        - 哪些情况必须拆出后置 Issue：
        - 退出后的恢复路径：
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 风险点
      description: 列出对主链路、数据一致性、部署、运行时和回归验证的风险。
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 验收标准
      description: 列出架构变更完成后的检查项。
      placeholder: |
        - 没有新旧链路并存
        - 没有旧字段 fallback
        - component 不消费 raw payload
        - lint / build 通过
    validations:
      required: true
  - type: textarea
    id: rollback_or_exit
    attributes:
      label: 回滚或退出条件
      description: 描述何时停止推进、如何回滚、或哪些条件满足后可退出迁移。
    validations:
      required: true
