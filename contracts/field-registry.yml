version: 1
summary: "AI Agent Workbench 人读字段登记表。机器可读契约位于 contracts/schemas/**/*.schema.json；此处只保留字段说明、历史记录和高风险字段备注。"
objects:
  ModelUsage:
    lifecycleNode: "11 Observability / Trace, 19 Audit / Governance / Cost"
    coreObject: "Usage"
    owner: "CloudBase Function / mapper"
    summary: "Canonical 模型用量状态，表达 usage 可用性和 token 数，不保留 legacy fallback 字段。"
    fields:
      promptTokens:
        type: "number | null"
        required: "yes"
        source: "LangChain model layer"
        description: "provider 返回的 prompt token 数。"
      completionTokens:
        type: "number | null"
        required: "yes"
        source: "LangChain model layer"
        description: "provider 返回的 completion token 数。"
      totalTokens:
        type: "number | null"
        required: "yes"
        source: "LangChain model layer"
        description: "provider 返回的总 token 数。"
      usageAvailable:
        type: "boolean"
        required: "yes"
        source: "LangChain model layer"
        description: "provider usage 数据是否可用。"
      usageSource:
        type: "provider | unavailable | none | estimated"
        required: "yes"
        source: "LangChain model layer"
        description: "模型用量来源的 canonical 标记。"
      usageUnavailableReason:
        type: "string | null"
        required: "yes"
        source: "LangChain model layer"
        description: "usage 不可用时的明确原因。"
  CostEstimate:
    lifecycleNode: "19 Audit / Governance / Cost"
    coreObject: "Usage"
    owner: "CloudBase Function / mapper"
    summary: "Canonical 预估成本状态，仅作为 metadata，不是计费记录。"
    fields:
      estimatedCost:
        type: "number | null"
        required: "yes"
        source: "LangChain model layer"
        description: "价格可用时的预估成本金额。"
      currency:
        type: "string | null"
        required: "yes"
        source: "model catalog"
        description: "预估成本使用的币种代码。"
      pricingUnit:
        type: "string | null"
        required: "yes"
        source: "model catalog"
        description: "预估成本使用的计价单位。"
      isEstimated:
        type: "boolean"
        required: "yes"
        source: "LangChain model layer"
        description: "成本金额是否为预估值。"
      pricingSource:
        type: "catalog | unavailable | none"
        required: "yes"
        source: "model catalog"
        description: "价格元数据来源。"
      costUnavailableReason:
        type: "string | null"
        required: "yes"
        source: "LangChain model layer"
        description: "成本不可估算时的明确原因。"
  ModelTrace:
    lifecycleNode: "11 Observability / Trace, 19 Audit / Governance / Cost"
    coreObject: "Run, Usage"
    owner: "CloudBase Function / mapper"
    summary: "绑定到 Run、report metadata、evaluation metadata 和 Run Trace 的 canonical model trace。"
    fields:
      selectedModelId:
        type: "string"
        required: "yes"
        source: "request selectedModelId"
        description: "前端选择的 model catalog ID。"
      provider:
        type: "string | null"
        required: "yes"
        source: "model catalog"
        description: "后端通过 model catalog 解析出的 provider。"
      model:
        type: "string | null"
        required: "yes"
        source: "model catalog"
        description: "后端通过 model catalog 解析出的 provider model 名称。"
      latencyMs:
        type: "number | null"
        required: "yes"
        source: "LangChain model layer"
        description: "模型调用耗时，单位为毫秒。"
      usage:
        type: "ModelUsage"
        required: "yes"
        source: "LangChain model layer"
        description: "canonical usage 对象。"
      costEstimate:
        type: "CostEstimate"
        required: "yes"
        source: "LangChain model layer"
        description: "canonical cost estimate 对象。"
      fallbackReason:
        type: "string | null"
        required: "yes"
        source: "Agent Run runtime"
        description: "conclusionSource 为 fallback 时的兜底原因。"
      modelErrorType:
        type: "string | null"
        required: "yes"
        source: "LangChain model layer"
        description: "标准化后的模型错误类型。"
      modelHttpStatus:
        type: "number | null"
        required: "no"
        source: "LangChain model layer"
        description: "provider 返回的 HTTP 状态码。"
      modelErrorMessage:
        type: "string | null"
        required: "no"
        source: "LangChain model layer"
        description: "经过安全处理的模型错误信息。"
      conclusionSource:
        type: "model | fallback | mock | none"
        required: "yes"
        source: "Agent Run runtime"
        description: "Chat、Run Trace、Report 和 Evaluation 共用的 canonical 结论来源。"
  AgentConclusion:
    lifecycleNode: "12 Response, 13 Artifact / Source / Report"
    coreObject: "Run, Message, Report"
    owner: "CloudBase Function / mapper"
    summary: "Canonical 结论信封，只拥有结论文本和提示；模型来源、兜底和模型错误状态属于 ModelTrace。"
    fields:
      markdownText:
        type: "string"
        required: "yes"
        source: "Agent Run runtime"
        description: "面向 assistant 消息展示的最终 markdown 结论。"
      plainText:
        type: "string"
        required: "yes"
        source: "Agent Run runtime"
        description: "用于搜索、预览和非 markdown 场景的纯文本结论。"
      sections:
        type: "AgentConclusionSection[]"
        required: "no"
        source: "Agent Run runtime"
        description: "可选的结构化结论段落。"
      notice:
        type: "string | null"
        required: "no"
        source: "Agent Run runtime"
        description: "可选的用户可见结论提示，用于说明限制或展示上下文。"
      rawText:
        type: "string"
        required: "no"
        source: "Agent Run runtime"
        description: "可选的原始结论文本，仅用于 debug 或无损渲染。"
  AgentConclusionSection:
    lifecycleNode: "12 Response, 13 Artifact / Source / Report"
    coreObject: "Run, Message, Report"
    owner: "CloudBase Function / mapper"
    summary: "AgentConclusion 内部的可选结构化段落。"
    fields:
      title:
        type: "string | null"
        required: "no"
        source: "Agent Run runtime"
        description: "可选的段落标题。"
      markdownText:
        type: "string"
        required: "yes"
        source: "Agent Run runtime"
        description: "段落 markdown 文本。"
      plainText:
        type: "string"
        required: "yes"
        source: "Agent Run runtime"
        description: "段落纯文本。"
  RunSnapshot:
    lifecycleNode: "10 Execution / Streaming, 11 Observability / Trace, 14 Persistence / Lineage"
    coreObject: "Run"
    owner: "Agent Run runtime / persistence mapper / API boundary"
    summary: "runtime 与 persistence 边界上的 canonical RunSnapshot。UI-only sessionId、displayRunId、conclusionSource、steps、toolInvocations、sources 属于 RunViewModel。"
    fields:
      id:
        type: "string"
        required: "yes"
        source: "agent_runs.id"
        description: "canonical runId，只指向 DB agent_runs.id。"
      conversationId:
        type: "string"
        required: "yes"
        source: "conversations.id"
        description: "拥有当前 Run 的 conversation。"
      clientRunId:
        type: "string | null"
        required: "no"
        source: "request idempotency"
        description: "前端 pending 与请求幂等 ID，不作为业务外键。"
      usageId:
        type: "string | null"
        required: "no"
        source: "agent_runs.usage_id"
        description: "持久化后的 usage 记录 ID。"
      mode:
        type: "mock | agent"
        required: "yes"
        source: "Agent Run runtime"
        description: "runtime 与 persistence 边界上的 Run 执行模式。"
      status:
        type: "pending | running | completed | failed | stopped"
        required: "yes"
        source: "agent_runs.status / Agent Run runtime"
        description: "runtime 与 persistence 边界上的 canonical Run 状态；UI 状态由 RunViewModel 映射。"
      intent:
        type: "capability_intro | data_analysis | knowledge_qa | unsupported | unknown"
        required: "no"
        source: "Agent Run planner"
        description: "Agent Run planner 已识别的意图。"
      prompt:
        type: "string"
        required: "no"
        source: "Agent Run request"
        description: "当前 Run 捕获的用户输入。"
      plan:
        type: "object"
        required: "no"
        source: "Agent Run planner"
        description: "runtime plan 快照；plan 细节不是 UI ViewModel 契约。"
      dataSource:
        type: "object"
        required: "no"
        source: "Agent Run runtime"
        description: "runtime 数据源快照。"
      chartData:
        type: "object"
        required: "no"
        source: "Agent Run runtime"
        description: "当前 Run 产出的 canonical 图表 payload。"
      agentConclusion:
        type: "AgentConclusion | null"
        required: "no"
        source: "Agent Run runtime"
        description: "当前 Run 的 canonical 结论信封。"
      modelTrace:
        type: "ModelTrace | null"
        required: "yes"
        source: "agent_runs.metadata.modelTrace"
        description: "当前 Run 的 canonical model trace。"
      reportState:
        type: "hidden | pending | generating | generated | skipped | failed"
        required: "yes"
        source: "Agent Run runtime / report_artifacts"
        description: "绑定在当前 Run 上的 canonical report 可用性与生成状态。"
      createdAt:
        type: "string"
        required: "yes"
        source: "agent_runs.created_at"
        description: "Run 创建时间。"
      updatedAt:
        type: "string"
        required: "yes"
        source: "agent_runs.updated_at"
        description: "Run 更新时间。"
      startedAt:
        type: "string"
        required: "no"
        source: "agent_runs.started_at"
        description: "Run 开始时间。"
      completedAt:
        type: "string"
        required: "no"
        source: "agent_runs.completed_at"
        description: "Run 完成时间。"
      elapsedMs:
        type: "number"
        required: "no"
        source: "agent_runs.elapsed_ms"
        description: "Run 耗时，单位为毫秒。"
      errorMessage:
        type: "string"
        required: "no"
        source: "agent_runs.error_message"
        description: "Run 失败时可展示的安全错误信息。"
  ReportMetadata:
    lifecycleNode: "13 Artifact / Source / Report, 14 Persistence / Lineage"
    coreObject: "Report"
    owner: "workbench-reports / mapper"
    summary: "Canonical report metadata。模型状态只能以单一 modelTrace 对象继承。"
    fields:
      runId:
        type: "string"
        required: "yes"
        source: "report_artifacts.run_id"
        description: "拥有该 report 的 canonical runId。"
      source:
        type: "string | null"
        required: "no"
        source: "Report metadata input allowlist"
        description: "report metadata 来源；请求 metadata 只能通过显式 allowlist 设置。"
      reportState:
        type: "string | null"
        required: "no"
        source: "workbench-reports"
        description: "用于持久化 report status artifact 的 report decision 状态。"
      toolNames:
        type: "string[]"
        required: "no"
        source: "Report metadata input allowlist"
        description: "拥有该 report 的 Run 使用过的工具名列表；不是模型用量 metadata。"
      modelTrace:
        type: "ModelTrace | null"
        required: "no"
        source: "agent_runs.metadata.modelTrace"
        description: "继承自 Run 的单一 model trace 对象；不得在 metadata 顶层展开模型字段。"
      langSmithTraceId:
        type: "string | null"
        required: "no"
        source: "LangSmith metadata"
        description: "外部 observability ID；不替代 canonical runId。"
  EvaluationMetadata:
    lifecycleNode: "15 Evaluation / Quality Gate"
    coreObject: "Evaluation"
    owner: "workbench-evaluations / mapper"
    summary: "Canonical evaluation metadata。模型状态只能以单一 modelTrace 对象继承。"
    fields:
      runId:
        type: "string"
        required: "yes"
        source: "eval_results.run_id"
        description: "该 evaluation result 评估的 canonical runId。"
      source:
        type: "string"
        required: "yes"
        source: "workbench-evaluations"
        description: "服务端设置的 evaluation metadata 来源。"
      resultVersion:
        type: "number"
        required: "yes"
        source: "workbench-evaluations"
        description: "evaluation metadata 格式版本。"
      modelTrace:
        type: "ModelTrace | null"
        required: "no"
        source: "agent_runs.metadata.modelTrace"
        description: "继承自 Run 的单一 model trace 对象；不得在 metadata 顶层展开模型字段。"
      evaluatorVersion:
        type: "string | null"
        required: "no"
        source: "evaluation runtime"
        description: "evaluator 或 rubric 版本。"
      langSmithTraceId:
        type: "string | null"
        required: "no"
        source: "LangSmith metadata"
        description: "外部 observability ID；不替代 canonical runId。"
      langSmithEvaluation:
        type: "Record<string, unknown>"
        required: "no"
        source: "LangSmith feedback boundary"
        description: "服务端创建的 LangSmith feedback 状态 metadata；请求 metadata 不得设置。"
schemaObjectReferences:
  ReportArtifact:
    lifecycleNode: "13 Artifact / Source / Report, 14 Persistence / Lineage"
    coreObject: "Report"
    owner: "workbench-reports / mapper"
    schema: "contracts/schemas/objects/report-artifact.schema.json"
    summary: "Report artifact boundary object。字段细节不在 field-registry.yml 中重复维护，以 schema 作为机器可读契约。"
  EvaluationResult:
    lifecycleNode: "15 Evaluation / Quality Gate"
    coreObject: "Evaluation"
    owner: "workbench-evaluations / mapper"
    schema: "contracts/schemas/objects/evaluation-result.schema.json"
    summary: "Evaluation result boundary object。字段细节不在 field-registry.yml 中重复维护，以 schema 作为机器可读契约。"
  RunSource:
    lifecycleNode: "13 Artifact / Source / Report, 14 Persistence / Lineage"
    coreObject: "Source"
    owner: "Source Lineage mapper"
    schema: "contracts/schemas/objects/run-source.schema.json"
    summary: "Run source canonical object。字段细节不在 field-registry.yml 中重复维护，以 schema 作为机器可读契约。"
  RunSseEventEnvelope:
    lifecycleNode: "10 Execution / Streaming, 11 Observability / Trace"
    coreObject: "Event"
    owner: "Agent Run SSE boundary"
    schema: "contracts/schemas/events/run-sse-event-envelope.schema.json"
    summary: "SSE event 公共 envelope schema，只定义 type / runId / conversationId / timestamp / payload 外壳，不定义具体业务字段。"
  RunStartedEvent:
    lifecycleNode: "10 Execution / Streaming, 11 Observability / Trace"
    coreObject: "Event, Run"
    owner: "Agent Run SSE boundary"
    schema: "contracts/schemas/events/run-started-event.schema.json"
    summary: "run_started SSE boundary schema 使用统一 envelope，payload.run 通过 $ref 引用 canonical RunSnapshot，不重复定义 RunSnapshot 字段。"
forbiddenFields:
  tokenUsage:
    pattern: "tokenUsage"
    reason: "Legacy usage object. Use ModelTrace.usage."
  conclusionNotice:
    pattern: "conclusionNotice"
    reason: "Legacy fallback notice. Use AgentConclusion.notice for user-facing notices and ModelTrace for fallback / model error state."
  agentConclusionSource:
    pattern: "agentConclusion.source"
    reason: "AgentConclusion owns text and notice only. Use ModelTrace.conclusionSource."
  agentConclusionConclusionSource:
    pattern: "agentConclusion.conclusionSource"
    reason: "Conclusion source belongs to ModelTrace.conclusionSource."
  agentConclusionFallbackReason:
    pattern: "agentConclusion.fallbackReason"
    reason: "Fallback reason belongs to ModelTrace.fallbackReason."
  agentConclusionModelErrorType:
    pattern: "agentConclusion.modelErrorType"
    reason: "Model error type belongs to ModelTrace.modelErrorType."
  agentConclusionContent:
    pattern: "agentConclusion.content"
    reason: "Use AgentConclusion.markdownText and AgentConclusion.plainText."
  agentConclusionSummary:
    pattern: "agentConclusion.summary"
    reason: "Use AgentConclusion.sections or AgentConclusion.notice."
  metadataClientRunId:
    pattern: "metadata.clientRunId"
    reason: "clientRunId is only pending / idempotency state, not persisted metadata relationship."
  modelTraceTokenUsage:
    pattern: "modelTrace.tokenUsage"
    reason: "Legacy model trace field. Use modelTrace.usage."
  usageNullishTokenUsage:
    pattern: "usage ?? tokenUsage"
    reason: "Old/new fallback chain. Normalize usage once in mapper."
  tokenUsageOrUsage:
    pattern: "tokenUsage || usage"
    reason: "Old/new fallback chain. Normalize usage once in mapper."
  rawRunConclusionSourceMock:
    pattern: "rawRun.conclusionSource ?? 'mock'"
    reason: "Mock source must be explicit and not a raw fallback."
  metadataProvider:
    pattern: "metadata.provider"
    reason: "Provider must come from canonical modelTrace."
  metadataSelectedModelId:
    pattern: "metadata.selectedModelId"
    reason: "Selected model id must come from canonical modelTrace."
  metadataModel:
    pattern: "metadata.model"
    reason: "Model must come from canonical modelTrace."
  metadataConclusionSource:
    pattern: "metadata.conclusionSource"
    reason: "Conclusion source must come from canonical modelTrace.conclusionSource."
  metadataUsage:
    pattern: "metadata.usage"
    reason: "Usage must come from canonical modelTrace.usage."
  metadataCostEstimate:
    pattern: "metadata.costEstimate"
    reason: "Cost estimate must come from canonical modelTrace.costEstimate."
  metadataFallbackReason:
    pattern: "metadata.fallbackReason"
    reason: "Fallback reason must come from canonical modelTrace.fallbackReason."
  metadataModelErrorType:
    pattern: "metadata.modelErrorType"
    reason: "Model error type must come from canonical modelTrace.modelErrorType."
